<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <style>
        :root { --accent-color: #f39c12; --bg-color: #f4f4f9; --primary-color: #6d4c41; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background-color: var(--bg-color); padding-bottom: 80px; }
        
        header { background-color: var(--accent-color); padding: 20px 15px; color: white; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .menu-icon { font-size: 24px; cursor: pointer; color: white; }
        .welcome-text { font-size: 18px; font-weight: bold; margin-left: 15px; }

        .search-box { background: white; display: flex; align-items: center; padding: 10px 15px; border-radius: 25px; }
        .search-box input { border: none; outline: none; width: 100%; margin-left: 10px; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .product-card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-img-container { width: 100%; height: 130px; border-radius: 8px; overflow: hidden; margin-bottom: 8px; background: #eee; }
        .product-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .price { font-weight: bold; color: var(--accent-color); margin: 5px 0; }
        .btn-add { background-color: var(--accent-color); color: white; border: none; padding: 8px; border-radius: 6px; width: 100%; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { text-align: center; font-size: 11px; color: #666; cursor: pointer; }

        /* Estilo unificado de paneles laterales */
        .side-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .side-content { width: 80%; max-width: 350px; height: 100%; background: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .side-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f9f9f9; padding-bottom: 10px; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="menu-icon" onclick="toggleModal('menuModal')">☰</div>
            <div class="welcome-text">Online Shop</div>
        </div>
        <div class="search-box">🔍<input type="text" id="searchInput" placeholder="¿Qué buscas?" onkeyup="filtrarProductos()"></div>
    </header>

    <div class="product-grid" id="product-container"></div>

    <!-- Menú de Categorías -->
    <div id="menuModal" class="side-modal" onclick="toggleModal('menuModal')">
        <div class="side-content" onclick="event.stopPropagation()">
            <div class="side-header"><h3>Categorías</h3><span onclick="toggleModal('menuModal')" style="cursor:pointer">✕</span></div>
            <div id="menuCategoriesList"></div>
        </div>
    </div>

    <!-- Menú de Carrito (Ahora igual a Categorías) -->
    <div id="cartModal" class="side-modal" onclick="toggleModal('cartModal')">
        <div class="side-content" onclick="event.stopPropagation()">
            <div class="side-header"><h3>Tu Carrito</h3><span onclick="toggleModal('cartModal')" style="cursor:pointer">✕</span></div>
            <div id="cartItemsList" style="flex-grow: 1; overflow-y: auto;"></div>
            <div id="cartTotalSection"></div>
            <button onclick="enviarPedidoWhatsApp()" style="width: 100%; background: #25d366; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Finalizar Pedido</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="seleccionarCategoria('TODOS')"><div>🏠</div>Inicio</div>
        <div class="nav-item" onclick="toggleModal('cartModal')"><div>🛒</div>Carrito</div>
    </nav>

    <script>
        let allProducts = [], carrito = [];

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        async function loadInventory() {
            // Reemplaza con tu lógica de carga de Google Sheets
            const res = await fetch("https://docs.google.com/spreadsheets/d/1bXSibj51JO5ilbs_HRkUy96-gTXQmC2NxGsyPXNyDU8/export?format=csv");
            const data = await res.text();
            // ... (Lógica de procesamiento de datos igual a la anterior)
            filtrarProductos();
        }

        function actualizarCarritoUI() {
            const list = document.getElementById('cartItemsList');
            if (carrito.length === 0) return list.innerHTML = "Tu carrito está vacío";
            
            list.innerHTML = carrito.map(i => `
                <div class="cart-item-row">
                    <div><strong>${i.nombre}</strong><br>$${i.precio}</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span>${i.cantidad}</span>
                        <button class="delete-btn" onclick="eliminarDelCarrito('${i.nombre}')">✕</button>
                    </div>
                </div>
            `).join('');
        }
        
        // ... (resto de funciones de lógica de carrito y carga)
        window.onload = loadInventory;
    </script>
</body>
</html>
