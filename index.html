<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <!-- ... [MANTEN EL CSS QUE YA TIENES] ... -->
</head>
<body>
    <!-- ... [MANTEN EL HEADER Y BUSCADOR QUE YA TIENES] ... -->

    <div class="product-grid" id="product-container"></div>

    <script>
        let allProducts = [], carrito = [], cantidades = {};

        // Función para cambiar cantidad en cualquier lugar (Tarjeta o Carrito)
        function cambiarCantidad(nombre, cambio, esBotonAgregar = false) {
            // Si el producto no está en el carrito, inicializamos en 1
            if (!cantidades[nombre]) cantidades[nombre] = 0;
            
            // Si es el botón "Agregar", solo suma 1 si estaba en 0
            if (esBotonAgregar) {
                if (cantidades[nombre] === 0) cantidades[nombre] = 1;
            } else {
                cantidades[nombre] = Math.max(0, cantidades[nombre] + cambio);
            }

            // Sincronizar con el objeto carrito
            const index = carrito.findIndex(i => i.nombre === nombre);
            if (cantidades[nombre] > 0) {
                const prodBase = allProducts.find(p => p.nombre === nombre);
                if (index > -1) {
                    carrito[index].cantidad = cantidades[nombre];
                } else {
                    carrito.push({ nombre, precio: prodBase.precio, cantidad: cantidades[nombre] });
                }
            } else {
                carrito = carrito.filter(i => i.nombre !== nombre);
            }

            actualizarVista();
        }

        function actualizarVista() {
            // Actualizar tarjetas principales
            allProducts.forEach(p => {
                const el = document.getElementById(`qty-text-${p.nombre}`);
                if (el) el.innerText = cantidades[p.nombre] || 0;
            });
            
            // Actualizar carrito
            actualizarCarritoBarra();
        }

        // --- REEMPLAZA TUS FUNCIONES ANTERIORES POR ESTAS ---

        // Llamada desde el botón "Agregar" de la tarjeta
        function agregarAlCarrito(nombre, precio) {
            cambiarCantidad(nombre, 0, true);
        }

        // Llamada desde los botones + y - de la tarjeta
        function cambiarTempCantidad(nombre, cambio) {
            cambiarCantidad(nombre, cambio);
        }

        // Llamada desde los botones + y - del carrito
        function cambiarCantidadCarrito(e, nombre, cambio) {
            e.stopPropagation();
            cambiarCantidad(nombre, cambio);
        }

        function actualizarCarritoBarra() {
            let totalPrecio = 0;
            const list = document.getElementById('cartItemsList');
            
            if (carrito.length === 0) {
                list.innerHTML = `<p>Tu carrito está vacío</p>`;
                document.getElementById('headerCartTotal').innerText = "$0.00";
                return;
            }

            list.innerHTML = carrito.map(i => {
                const prod = allProducts.find(p => p.nombre === i.nombre);
                let precioActual = (prod.minDesc > 0 && i.cantidad >= prod.minDesc) ? prod.precioDesc : prod.precio;
                totalPrecio += (precioActual * i.cantidad);
                
                return `<div class="cart-item-row">
                    <div><strong>${i.nombre}</strong><br>$${(precioActual * i.cantidad).toFixed(2)}</div>
                    <div class="cart-qty-controls">
                        <button class="qty-btn" onclick="cambiarCantidadCarrito(event, '${i.nombre}', -1)">-</button>
                        <span>${i.cantidad}</span>
                        <button class="qty-btn" onclick="cambiarCantidadCarrito(event, '${i.nombre}', 1)">+</button>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('headerCartTotal').innerText = `$${totalPrecio.toFixed(2)}`;
        }

        // Asegúrate de que al cargar los productos inicialices el objeto cantidades
        // allProducts.forEach(p => cantidades[p.nombre] = 0);
    </script>
</body>
</html>
