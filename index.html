<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda y Mini Súper Online Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #ff9800;
            --bg-color: #f4f6f8;
            --text-color: #333333;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .search-bar {
            flex: 0 1 400px;
            display: flex;
            background: var(--white);
            border-radius: 50px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .search-bar input {
            flex: 1;
            padding: 0.6rem 1.2rem;
            border: none;
            outline: none;
            font-size: 0.95rem;
        }

        .search-bar button {
            background: var(--accent);
            border: none;
            padding: 0 1.2rem;
            color: var(--white);
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-bar button:hover {
            background: #f57c00;
        }

        .cart-btn {
            background: var(--white);
            color: var(--primary-dark);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .cart-btn:hover {
            transform: scale(1.05);
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
            flex: 1;
            width: 100%;
        }

        aside {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            height: fit-content;
        }

        aside h3 {
            margin-bottom: 1rem;
            color: var(--primary-dark);
            font-size: 1.1rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 0.5rem;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
        }

        .category-item:hover, .category-item.active {
            background: var(--primary);
            color: var(--white);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .add-to-cart {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .add-to-cart:hover {
            background: var(--primary-dark);
        }
        /* Carrito lateral flotante */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: var(--white);
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: right 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            background: var(--primary-dark);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-body {
            padding: 1.5rem;
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eee;
        }

        .cart-footer {
            padding: 1.5rem;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .checkout-btn {
            background: #25D366;
            color: var(--white);
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background: #1EBE5D;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            header {
                flex-direction: column;
                gap: 1rem;
            }
            .search-bar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <i class="fa-solid fa-store"></i>
            <h1>Online Shop</h1>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar productos...">
            <button><i class="fa-solid fa-search"></i></button>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i> <span id="cartCount">0</span>
        </button>
    </header>

    <div class="main-container">
        <aside>
            <h3>Categorías</h3>
            <ul class="category-list">
                <li class="category-item active" onclick="filterCategory('todos')">Todos</li>
                <li class="category-item" onclick="filterCategory('abrosteria')">Abarrotes</li>
                <li class="category-item" onclick="filterCategory('bebidas')">Bebidas</li>
                <li class="category-item" onclick="filterCategory('limpieza')">Limpieza</li>
            </ul>
        </aside>

        <main>
            <div class="products-grid" id="productsGrid">
                <!-- Los productos se cargan dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Carrito Desplegable -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Tu Carrito de Compras</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            <p style="text-align: center; color: #888;">El carrito está vacío</p>
        </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 700;">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Pedir por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Arroz San Francisco 2lb", price: 1.75, category: "abrosteria", img: "https://via.placeholder.com/200" },
            { id: 2, name: "Frijol Negro 2lb", price: 2.10, category: "abrosteria", img: "https://via.placeholder.com/200" },
            { id: 3, name: "Coca Cola 2 Litros", price: 2.25, category: "bebidas", img: "https://via.placeholder.com/200" },
            { id: 4, name: "Detergente Rey 1kg", price: 2.50, category: "limpieza", img: "https://via.placeholder.com/200" }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" class="product-img">
                    <div class="product-info">
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">$${p.price.toFixed(2)}</div>
                        </div>
                        <button class="add-to-cart" onclick="addToCart(${p.id})">Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'todos') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({...product, qty: 1});
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const countSpan = document.getElementById('cartCount');
            const totalSpan = document.getElementById('cartTotal');
            
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            countSpan.textContent = totalItems;

            if(cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888;">El carrito está vacío</p>`;
                totalSpan.textContent = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>$${item.price.toFixed(2)} x ${item.qty}</small>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="border:none; background:none; color:red; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');

            totalSpan.textContent = `$${total.toFixed(2)}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert("Tu carrito está vacío");
            let message = "¡Hola! Quisiera hacer el siguiente pedido:\n\n";
            let total = 0;
            cart.forEach(item => {
                message += `- ${item.qty}x ${item.name} ($${(item.price * item.qty).toFixed(2)})\n`;
                total += item.price * item.qty;
            });
            message += `\n*Total a pagar: $${total.toFixed(2)}*`;
            
            const phone = "50300000000"; // Reemplaza con tu número de WhatsApp
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Inicializar vista
        renderProducts(products);
    </script>
</body>
</html>
