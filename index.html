    <script>
        // ... [Mantén todo el código JS anterior hasta llegar a estas funciones] ...

        function agregarAlCarritoDesdeCard(nombre, precio, index) {
            const display = document.getElementById(`qty-${index}`);
            const cantidadSeleccionada = parseInt(display.innerText);

            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cantidadSeleccionada;
            } else {
                carrito.push({ nombre, precio, cantidad: cantidadSeleccionada });
            }

            // Opcional: Reiniciar el contador a 1 después de agregar para que sea intuitivo
            display.innerText = 1;

            actualizarCarritoBarra();
        }

        // NUEVA FUNCIÓN: Ahora permite restar dentro del carrito
        function modificarCantidadCarrito(nombre, cambio) {
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    eliminarDelCarrito(nombre); // Si llega a 0, se elimina
                } else {
                    actualizarCarritoBarra();
                }
            }
        }

        function eliminarDelCarrito(nombre) {
            carrito = carrito.filter(i => i.nombre !== nombre);
            actualizarCarritoBarra();
        }

        function actualizarCarritoBarra() {
            const totalItems = carrito.reduce((s, i) => s + i.cantidad, 0);
            const totalPrice = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
            
            const badge = document.getElementById('cartBadge');
            badge.innerText = totalItems;
            badge.style.display = totalItems > 0 ? 'block' : 'none';
            
            const list = document.getElementById('cartItemsList');
            const totalSection = document.getElementById('cartTotalSection');

            if (carrito.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: #888; font-size: 14px;">Tu carrito está vacío</p>`;
                totalSection.innerHTML = '';
                return;
            }

            list.innerHTML = carrito.map(i => `
                <div class="cart-item-row">
                    <div>
                        <strong>${i.nombre}</strong><br>
                        <span style="color: #666; font-size: 12px;">$${(i.precio * i.cantidad).toFixed(2)}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button onclick="modificarCantidadCarrito('${i.nombre}', -1)" style="border:none; background:#eee; padding: 2px 8px; border-radius:4px;">-</button>
                        <span>${i.cantidad}</span>
                        <button onclick="modificarCantidadCarrito('${i.nombre}', 1)" style="border:none; background:#eee; padding: 2px 8px; border-radius:4px;">+</button>
                        <button class="delete-btn" onclick="eliminarDelCarrito('${i.nombre}')">🗑️</button>
                    </div>
                </div>
            `).join('');

            totalSection.innerHTML = `
                <div class="cart-total-row">
                    <span>Total a Pagar:</span>
                    <span style="color: var(--accent-color);">$${totalPrice.toFixed(2)}</span>
                </div>
            `;
        }

        // ... [Resto de las funciones: toggleCartModal, enviarPedidoWhatsApp, etc.] ...
    </script>
