    <script>
        let lastScrollTop = 0;
        const searchBarWrapper = document.getElementById('searchBarWrapper');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                searchBarWrapper.classList.add('hidden');
            } else {
                searchBarWrapper.classList.remove('hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, false);

        let currentIndex = 0;
        function changeSlide() {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;
            currentIndex = (currentIndex + 1) % slides.length;
            const container = document.getElementById('sliderContainer');
            container.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
        setInterval(changeSlide, 4000);

        let allProducts = [], carrito = [], categoriaSeleccionada = 'TODOS';
        let sugCantidades = {}, cardCantidades = {}, modalCantidades = {}, principalModalCantidad = 1;
        let productoModalActual = null;
        let paginaActual = 1;
        const productosPorPagina = 12;

        window.onload = () => { loadInventory(false); };

        document.addEventListener('click', function(event) {
            const modal = document.getElementById('cartModal');
            const cartBtn = document.querySelector('.header-cart-btn');
            const searchContainer = document.querySelector('.search-container');
            const productModal = document.getElementById('productModal');

            if (modal.style.display === 'flex' && !modal.contains(event.target) && !cartBtn.contains(event.target)) modal.style.display = 'none';
            if (productModal.style.display === 'flex' && event.target === productModal) productModal.style.display = 'none';
            if (!searchContainer.contains(event.target)) {
                document.getElementById('searchSuggestions').style.display = 'none';
                document.body.classList.remove('search-active');
            }
        });

        function toggleMenu(e) {
            const modal = document.getElementById('menuModal');
            if (!e || e.target === modal || e.currentTarget.classList.contains('menu-icon')) modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleAdminPanel() {
            toggleMenu();
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        async function loadInventory(save) {
            let url = localStorage.getItem('savedSheetUrl') || "https://docs.google.com/spreadsheets/d/1bXSibj51JO5ilbs_HRkUy96-gTXQmC2NxGsyPXNyDU8/edit?usp=sharing";
            if (save) { url = document.getElementById('sheetUrl').value; localStorage.setItem('savedSheetUrl', url); }
            url = url.split('/edit')[0] + '/export?format=csv';
            try {
                const res = await fetch(url);
                const data = await res.text();
                const lines = data.split('\n');
                allProducts = lines.slice(1).map(line => {
                    // Separa respetando las comillas del archivo CSV
                    const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                    const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : '';

                    const limpiarNum = (val) => {
                        if (!val) return 0;
                        return parseFloat(clean(val).replace('$', '').replace(',', '.')) || 0;
                    };

                    const catRaw = clean(cols[3]) || 'GENERAL';
                    
                    // Divide por coma y limpia espacios para separar "ACEITES, MAYOREO"
                    const categoriasArray = catRaw.split(',')
                        .map(c => c.trim().toUpperCase())
                        .filter(c => c.length > 0);

                    return { 
                        nombre: clean(cols[0]), 
                        existencia: clean(cols[1]), 
                        precio: limpiarNum(cols[2]), 
                        categoria: categoriasArray.length > 0 ? categoriasArray : ['GENERAL'], 
                        imagen: clean(cols[4]), 
                        mostrar: cols[5] ? clean(cols[5]).toUpperCase() : 'SI',
                        minDesc: parseInt(clean(cols[6])) || 0, 
                        precioDesc: limpiarNum(cols[7])
                    };
                }).filter(p => p.nombre !== '' && p.mostrar !== 'NO');
                
                allProducts.forEach(p => { 
                    sugCantidades[p.nombre] = 1; 
                    cardCantidades[p.nombre] = 1;
                    modalCantidades[p.nombre] = 1;
                });
                generarMenuCategorias();
                filtrarProductos();
            } catch(e) { console.error(e); }
        }

        function generarMenuCategorias() {
            const container = document.getElementById('menuCategoriesList');
            const todasLasCategorias = allProducts.flatMap(p => p.categoria);
            const cats = [...new Set(todasLasCategorias)].sort();
            container.innerHTML = `<button class="menu-cat-btn" onclick="seleccionarCategoria('TODOS')">📋 TODOS</button>` + cats.map(c => `<button class="menu-cat-btn" onclick="seleccionarCategoria('${c}')">📁 ${c}</button>`).join('');
        }

        function seleccionarCategoria(cat) { 
            categoriaSeleccionada = cat; paginaActual = 1; filtrarProductos(); document.getElementById('searchSuggestions').style.display = 'none'; document.body.classList.remove('search-active'); document.getElementById('searchInput').value = ''; document.getElementById('clearSearchBtn').style.display = 'none'; document.getElementById('menuModal').style.display = 'none';
        }

        function manejarBusqueda() {
            const textoInput = document.getElementById('searchInput').value;
            document.getElementById('clearSearchBtn').style.display = textoInput.length > 0 ? 'block' : 'none';
            paginaActual = 1; filtrarProductos(); mostrarSugerenciasFlotantes(textoInput);
        }

        function limpiarBusqueda() {
            document.getElementById('searchInput').value = ''; 
            document.getElementById('clearSearchBtn').style.display = 'none'; 
            document.getElementById('searchSuggestions').style.display = 'none'; 
            document.body.classList.remove('search-active'); 
            paginaActual = 1; 
            filtrarProductos();
        }

        function mostrarSugerenciasFlotantes(texto) {
            const suggestionsBox = document.getElementById('searchSuggestions'), suggestionsList = document.getElementById('suggestionsList');
            if (!texto || texto.trim() === '') { 
                suggestionsBox.style.display = 'none'; 
                document.body.classList.remove('search-active'); 
                return; 
            }
            
            const filtrados = allProducts.filter(p => p.nombre.toLowerCase().includes(texto.toLowerCase())).slice(0, 5);
            
            if (filtrados.length === 0) { 
                suggestionsBox.style.display = 'none'; 
                document.body.classList.remove('search-active'); 
                return; 
            }

            document.body.classList.add('search-active');

            suggestionsList.innerHTML = filtrados.map(p => {
                let qty = sugCantidades[p.nombre] || 1;
                let promoRibbonText = '';
                if (p.minDesc > 0 && p.precioDesc > 0) {
                    let totalPromo = (p.minDesc * p.precioDesc).toFixed(2);
                    promoRibbonText = `<div style="font-size: 10px; color: #16a085;">📦 Seleccione ${p.minDesc}X$${totalPromo}</div>`;
                }
                return `<div class="suggestion-item" onclick="abrirModalPorNombreYLimpiarBusqueda('${p.nombre}')">
                    <img class="suggestion-img" src="${p.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" alt="${p.nombre}" loading="lazy">
                    <div class="suggestion-info">
                        <div class="suggestion-name">${p.nombre}</div>
                        <div class="suggestion-price">$${p.precio.toFixed(2)}</div>
                        ${promoRibbonText}
                    </div>
                    <div class="suggestion-actions" onclick="event.stopPropagation()">
                        <div class="sug-qty-controls">
                            <button class="sug-qty-btn" onclick="cambiarSugCantidad('${p.nombre}', -1, event)">-</button>
                            <span class="sug-qty-num" id="sug-qty-${p.nombre}">${qty}</span>
                            <button class="sug-qty-btn" onclick="cambiarSugCantidad('${p.nombre}', 1, event)">+</button>
                        </div>
                        <button class="sug-add-btn" onclick="agregarDesdeSugerencia('${p.nombre}', ${p.precio}, event)">🛒</button>
                    </div>
                </div>`;
            }).join('');
            suggestionsBox.style.display = 'block';
        }

        function abrirModalPorNombreYLimpiarBusqueda(nombre) {
            document.getElementById('searchSuggestions').style.display = 'none';
            document.body.classList.remove('search-active');
            abrirModalPorNombre(nombre);
        }

        function cambiarSugCantidad(nombre, cambio, event) {
            event.stopPropagation();
            if (!sugCantidades[nombre]) sugCantidades[nombre] = 1;
            sugCantidades[nombre] = Math.max(1, sugCantidades[nombre] + cambio);
            document.getElementById(`sug-qty-${nombre}`).innerText = sugCantidades[nombre];
        }

        function agregarDesdeSugerencia(nombre, precio, event) {
            event.stopPropagation();
            const cantidad = sugCantidades[nombre] || 1;
            const item = carrito.find(i => i.nombre === nombre);
            if (item) item.cantidad += cantidad; else carrito.push({ nombre, precio, cantidad });
            
            sugCantidades[nombre] = 1;
            actualizarCarritoBarra();
        }

        function filtrarProductos() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = allProducts.filter(p => {
                const cumpleCategoria = (categoriaSeleccionada === 'TODOS' || p.categoria.includes(categoriaSeleccionada));
                const cumpleTexto = p.nombre.toLowerCase().includes(texto);
                return cumpleCategoria && cumpleTexto;
            });

            const totalPaginas = Math.ceil(filtrados.length / productosPorPagina) || 1;
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            const productosPagina = filtrados.slice((paginaActual - 1) * productosPorPagina, paginaActual * productosPorPagina);
            
            document.getElementById('product-container').innerHTML = productosPagina.map(p => {
                let promoRibbonHtml = '';
                if (p.minDesc > 0 && p.precioDesc > 0) {
                    let totalPromo = (p.minDesc * p.precioDesc).toFixed(2);
                    promoRibbonHtml = `<div class="promo-badge-ribbon">Seleccione ${p.minDesc}X$${totalPromo}</div>`;
                }

                let currentCardQty = cardCantidades[p.nombre] || 1;

                return `<div class="product-card">
                    ${promoRibbonHtml}
                    <div class="product-img-container" onclick="abrirModalPorNombre('${p.nombre}')">
                        <img src="${p.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" alt="${p.nombre}" loading="lazy">
                    </div>
                    <h3>${p.nombre}</h3>
                    <p class="price">$${p.precio.toFixed(2)}</p>
                    <div class="product-bottom-action">
                        <div class="product-qty-box">
                            <button class="product-qty-btn" onclick="cambiarCardCantidad('${p.nombre}', -1)">-</button>
                            <span class="product-qty-num" id="card-qty-${p.nombre}">${currentCardQty}</span>
                            <button class="product-qty-btn" onclick="cambiarCardCantidad('${p.nombre}', 1)">+</button>
                        </div>
                        <button class="product-cart-action-btn" onclick="agregarAlCarritoDesdeTarjeta('${p.nombre}', ${p.precio})">
                            <svg viewBox="0 0 24 24">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                        </button>
                    </div>
                </div>`;
            }).join('');
            renderizarPaginacion(totalPaginas);
        }

        function abrirModalPorNombre(nombre) {
            const p = allProducts.find(item => item.nombre === nombre);
            if (p) {
                abrirModalProducto(p);
            }
        }

        function abrirModalProducto(p) {
            productoModalActual = { nombre: p.nombre, precio: p.precio };
            principalModalCantidad = 1;
            document.getElementById('modalPrincipalQty').innerText = '1';

            document.getElementById('modalNombre').innerText = p.nombre;
            document.getElementById('modalPrecio').innerText = `$${p.precio.toFixed(2)}`;
            document.getElementById('modalImg').src = p.imagen || 'https://via.placeholder.com/150?text=Sin+Foto';

            const imgContainer = document.getElementById('modalImgContainer');
            const etiquetaExistente = imgContainer.querySelector('.promo-badge-ribbon');
            if (etiquetaExistente) etiquetaExistente.remove();

            if (p.minDesc > 0 && p.precioDesc > 0) {
                let totalPromo = (p.minDesc * p.precioDesc).toFixed(2);
                const ribbon = document.createElement('div');
                ribbon.className = 'promo-badge-ribbon';
                ribbon.innerText = `Seleccione ${p.minDesc}X$${totalPromo}`;
                imgContainer.appendChild(ribbon);
            }

            const relacionados = allProducts.filter(item => 
                item.nombre !== p.nombre && 
                item.categoria.some(c => p.categoria.includes(c))
            ).slice(0, 4);
            
            const containerRel = document.getElementById('modalRelacionados');

            if (relacionados.length === 0) {
                containerRel.innerHTML = `<p style="font-size: 12px; color: #888; text-align: center; grid-column: span 2;">No hay más productos en esta categoría.</p>`;
            } else {
                containerRel.innerHTML = relacionados.map(r => {
                    let qtyModal = modalCantidades[r.nombre] || 1;
                    return `
                        <div style="background: white; padding: 10px; border-radius: 10px; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between;">
                            <div onclick="abrirModalPorNombre('${r.nombre}')" style="cursor: pointer;">
                                <div style="width: 100%; height: 90px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; border-radius: 6px; margin-bottom: 6px;">
                                    <img src="${r.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                                </div>
                                <div style="font-size: 12px; font-weight: bold; color: #333; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${r.nombre}</div>
                                <div style="font-size: 13px; color: var(--accent-color); font-weight: bold; margin: 4px 0;">$${r.precio.toFixed(2)}</div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px; margin-top: 6px;">
                                <div style="display: flex; align-items: center; justify-content: space-between; background: #eef2f5; border-radius: 6px; padding: 2px; border: 1px solid #dcdcdc; flex-grow: 1; height: 32px;">
                                    <button style="background:none; border:none; font-size:14px; font-weight:bold; color:#555; cursor:pointer; padding:0 6px;" onclick="cambiarModalCantidad('${r.nombre}', -1)">-</button>
                                    <span style="font-size: 12px; font-weight: bold; color: #333;" id="modal-qty-${r.nombre}">${qtyModal}</span>
                                    <button style="background:none; border:none; font-size:14px; font-weight:bold; color:#555; cursor:pointer; padding:0 6px;" onclick="cambiarModalCantidad('${r.nombre}', 1)">+</button>
                                </div>
                                <button style="background-color: var(--accent-color); border: none; border-radius: 6px; width: 34px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;" onclick="agregarDesdeModalRelacionado('${r.nombre}', ${r.precio})">
                                    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;">
                                        <circle cx="9" cy="21" r="1"></circle>
                                        <circle cx="20" cy="21" r="1"></circle>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('productModal').style.display = 'flex';
        }

        function cambiarPrincipalModalCantidad(cambio) {
            principalModalCantidad = Math.max(1, principalModalCantidad + cambio);
            document.getElementById('modalPrincipalQty').innerText = principalModalCantidad;
        }

        function agregarProductoPrincipalDesdeModal() {
            if (!productoModalActual) return;
            const item = carrito.find(i => i.nombre === productoModalActual.nombre);
            if (item) {
                item.cantidad += principalModalCantidad;
            } else {
                carrito.push({ nombre: productoModalActual.nombre, precio: productoModalActual.precio, cantidad: principalModalCantidad });
            }
            principalModalCantidad = 1;
            document.getElementById('modalPrincipalQty').innerText = '1';
            actualizarCarritoBarra();
        }

        function cambiarModalCantidad(nombre, cambio) {
            if (!modalCantidades[nombre]) modalCantidades[nombre] = 1;
            modalCantidades[nombre] = Math.max(1, modalCantidades[nombre] + cambio);
            const el = document.getElementById(`modal-qty-${nombre}`);
            if (el) el.innerText = modalCantidades[nombre];
        }

        function agregarDesdeModalRelacionado(nombre, precio) {
            const cantidadSeleccionada = modalCantidades[nombre] || 1;
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cantidadSeleccionada;
            } else {
                carrito.push({ nombre, precio, cantidad: cantidadSeleccionada });
            }
            modalCantidades[nombre] = 1;
            const el = document.getElementById(`modal-qty-${nombre}`);
            if (el) el.innerText = 1;
            
            actualizarCarritoBarra();
        }

        function cerrarModalProducto() {
            document.getElementById('productModal').style.display = 'none';
        }

        function renderizarPaginacion(totalPaginas) {
            const container = document.getElementById('pagination-section');
            if (totalPaginas <= 1) { container.innerHTML = ''; return; }
            let inicio = Math.max(1, paginaActual - 2), fin = Math.min(totalPaginas, inicio + 4);
            if (fin - inicio < 4) inicio = Math.max(1, fin - 4);
            let botones = '';
            for (let i = inicio; i <= fin; i++) botones += `<button class="page-btn ${i === paginaActual ? 'active' : ''}" onclick="cambiarPagina(${i})">${i}</button>`;
            container.innerHTML = `<div class="pagination-container"><div class="pagination-info">Página ${paginaActual} de ${totalPaginas}</div><div class="pagination-controls"><button class="page-btn" onclick="cambiarPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>Anterior</button>${botones}<button class="page-btn" onclick="cambiarPagina(${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled' : ''}>Siguiente</button></div></div>`;
        }

        function cambiarPagina(n) { paginaActual = n; filtrarProductos(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function cambiarCardCantidad(nombre, cambio) {
            if (!cardCantidades[nombre]) cardCantidades[nombre] = 1;
            cardCantidades[nombre] = Math.max(1, cardCantidades[nombre] + cambio);
            const el = document.getElementById(`card-qty-${nombre}`);
            if (el) el.innerText = cardCantidades[nombre];
        }

        function agregarAlCarritoDesdeTarjeta(nombre, precio) {
            const cantidadSeleccionada = cardCantidades[nombre] || 1;
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cantidadSeleccionada;
            } else {
                carrito.push({ nombre, precio, cantidad: cantidadSeleccionada });
            }
            cardCantidades[nombre] = 1;
            const el = document.getElementById(`card-qty-${nombre}`);
            if (el) el.innerText = 1;
            
            actualizarCarritoBarra();
        }

        function cambiarCantidadCarrito(e, nombre, cambio) {
            e.stopPropagation();
            const item = carrito.find(i => i.nombre === nombre);
            if (item) { 
                item.cantidad += cambio; 
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.nombre !== nombre);
                }
            }
            actualizarCarritoBarra();
        }

        function actualizarCarritoBarra() {
            let totalPrecio = 0;
            
            const carritoConPrecios = carrito.map(item => {
                const productoBase = allProducts.find(p => p.nombre === item.nombre);
                let precioFinal = item.precio;

                if (productoBase && productoBase.minDesc > 0 && productoBase.precioDesc > 0 && item.cantidad >= productoBase.minDesc) {
                    precioFinal = productoBase.precioDesc;
                }
                
                totalPrecio += (precioFinal * item.cantidad);
                return { ...item, precioFinal };
            });

            document.getElementById('headerCartTotal').innerText = `$${totalPrecio.toFixed(2)}`;
            
            const list = document.getElementById('cartItemsList');
            if (carrito.length === 0) { 
                list.innerHTML = `<p style="text-align: center; color: #888; font-size: 13px;">Tu carrito está vacío</p>`; 
                document.getElementById('cartTotalSection').innerHTML = ''; 
                return; 
            }

            list.innerHTML = carritoConPrecios.map(i => {
                const subtotal = (i.precioFinal * i.cantidad).toFixed(2);
                return `<div class="cart-item-row">
                    <div>
                        <strong>${i.nombre}</strong><br>
                        <span style="color: #666; font-size: 11px;">$${subtotal} (${i.cantidad} unids)</span>
                        ${i.precioFinal < i.precio ? '<span style="color: #16a085; font-size: 10px; display:block; font-weight:bold;">✓ ¡Precio de mayor aplicado!</span>' : ''}
                    </div>
                    <div class="cart-qty-controls">
                        <button class="qty-btn" onclick="cambiarCantidadCarrito(event, '${i.nombre}', -1)">-</button>
                        <span style="font-weight: bold; min-width: 22px; text-align: center; font-size: 15px;">${i.cantidad}</span>
                        <button class="qty-btn" onclick="cambiarCantidadCarrito(event, '${i.nombre}', 1)">+</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('cartTotalSection').innerHTML = `<div class="cart-total-row"><span>Total:</span><span style="color: var(--accent-color);">$${totalPrecio.toFixed(2)}</span></div>`;
        }

        function toggleCartModal() { const modal = document.getElementById('cartModal'); modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex'; }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return alert("Tu carrito está vacío");
            
            let msg = "Hola, quiero hacer el siguiente pedido:\n";
            let totalPrecio = 0;

            carrito.forEach(i => {
                const productoBase = allProducts.find(p => p.nombre === i.nombre);
                let precioFinal = i.precio;
                let esMayor = false;
                if (productoBase && productoBase.minDesc > 0 && productoBase.precioDesc > 0 && i.cantidad >= productoBase.minDesc) {
                    precioFinal = productoBase.precioDesc;
                    esMayor = true;
                }
                totalPrecio += (precioFinal * i.cantidad);
                msg += `• ${i.cantidad}x ${i.nombre} - $${(precioFinal * i.cantidad).toFixed(2)}${esMayor ? ' (Precio de mayor)' : ''}\n`;
            });

            msg += `\n*Total: $${totalPrecio.toFixed(2)}*`;
            window.open(`https://wa.me/50374184366?text=${encodeURIComponent(msg)}`);
            carrito = []; actualizarCarritoBarra(); filtrarProductos(); toggleCartModal();
        }
    </script>
</body>
</html>
