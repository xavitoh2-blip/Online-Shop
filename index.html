<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <style>
        /* Estilos generales para mantener la línea visual */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            padding-bottom: 70px; /* Espacio para la barra inferior */
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
        }

        /* Cuadrícula de productos */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Tarjeta de producto */
        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #eaeaea;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .product-card h3 {
            font-size: 0.85rem;
            color: #222;
            margin: 5px 0;
            font-weight: 600;
            text-transform: uppercase;
        }

        .price {
            color: #e67e22;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        /* Controles de cantidad (- / +) */
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin-top: auto;
        }

        .quantity-control button {
            background-color: #f1f1f1;
            border: none;
            color: #333;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quantity-control button:active {
            background-color: #e67e22;
            color: white;
        }

        .quantity-display {
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
        }

        /* Barra de navegación inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }

        .nav-item {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Productos Destacados</h2>

        <div class="product-grid">
            <!-- Producto 1 -->
            <div class="product-card">
                <img src="" alt="Alitas Granel">
                <h3>ALITAS GRANEL 1LB</h3>
                <div class="price">$3.00</div>
                
                <div class="quantity-control">
                    <button onclick="cambiarCantidad(this, -1)">-</button>
                    <span class="quantity-display">1</span>
                    <button onclick="cambiarCantidad(this, 1)">+</button>
                </div>
            </div>

            <!-- Producto 2 -->
            <div class="product-card">
                <img src="" alt="Alitas Sin Hueso Ajo Parmesano">
                <h3>ALITAS SIN HUESO AJO PARMESANO</h3>
                <div class="price">$3.50</div>
                
                <div class="quantity-control">
                    <button onclick="cambiarCantidad(this, -1)">-</button>
                    <span class="quantity-display">1</span>
                    <button onclick="cambiarCantidad(this, 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Menú inferior fijo -->
    <div class="bottom-nav">
        <a href="#" class="nav-item">🏠<br>Inicio</a>
        <a href="#" class="nav-item">💬<br>WhatsApp</a>
        <a href="#" class="nav-item">🛒<br>Carrito</a>
    </div>

    <script>
        // Función para sumar y restar la cantidad directamente en la tarjeta
        function cambiarCantidad(button, cambio) {
            const container = button.parentElement;
            const display = container.querySelector('.quantity-display');
            
            let cantidadActual = parseInt(display.textContent);
            let nuevaCantidad = cantidadActual + cambio;
            
            // Evita que la cantidad baje de 1
            if (nuevaCantidad >= 1) {
                display.textContent = nuevaCantidad;
            }
        }
    </script>

</body>
</html>
