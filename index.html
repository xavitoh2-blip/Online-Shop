<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online Shop</title>
    <style>
        :root { --accent-color: #f39c12; --bg-color: #f4f4f9; }
        
        *, *::before, *::after { box-sizing: border-box; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100%;
            height: 100%;
        }

        body { 
            padding-top: 70px; 
            padding-bottom: 40px; 
        }

        /* --- HEADER --- */
        header { 
            background-color: #ffffff; 
            color: var(--accent-color); 
            padding: 15px; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px solid #e0e0e0;
            z-index: 2000;
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; }
        
        .welcome-text { 
            font-size: 18px; 
            font-weight: bold; 
            color: var(--accent-color);
            cursor: pointer;
        }

        .header-cart-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 18px;
        }
        .header-cart-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* --- PRODUCTOS --- */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .product-card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee; position: relative; }
        
        .promo-badge-ribbon {
            position: absolute; top: 0; left: 0;
            background-color: #e74c3c; color: white;
            font-size: 10px; font-weight: bold;
            padding: 4px 10px; border-bottom-right-radius: 8px;
            z-index: 10;
        }

        .product-img-container { width: 100%; height: 130px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
        .product-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-card h3 { font-size: 14px; margin: 6px 0; color: #333; height: 36px; overflow: hidden; }
        .product-card .price { font-weight: bold; color: var(--accent-color); font-size: 16px; }
        
        /* Controles de cantidad (se muestran cuando ya está agregado) */
        .product-qty-box { 
            display: none; /* Oculto por defecto */
            align-items: center; justify-content: space-between;
            background: #f1f1f1; border-radius: 8px;
            padding: 4px 8px; margin: 8px 0;
        }
        /* Clase que muestra los controles cuando la cantidad > 0 */
        .product-qty-box.activo { display: flex; }

        .product-qty-btn { background: none; border: none; font-size: 18px; font-weight: bold; color: var(--accent-color); cursor: pointer; padding: 0 8px; }
        .product-qty-num { font-size: 15px; font-weight: bold; color: #333; }
        
        /* Botón "Agregar" (se muestra solo la primera vez) */
        .add-btn-first { 
            background-color: var(--accent-color); color: white; border: none;
            padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;
            display: block; /* Mostrado por defecto */
        }
        /* Ocultar botón "Agregar" cuando ya está en el carrito */
        .add-btn-first.oculto { display: none; }

        /* --- CARRITO MODAL --- */
        #cartModal { 
            display: none; position: fixed; top: 70px; right: 15px;
            max-width: 320px; width: 90%; background: white;
            border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 3500; padding: 15px; max-height: 65vh; flex-direction: column;
        }
        .cart-header-title { font-size: 16px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 6px; display: flex; justify-content: space-between; }
        #cartItemsList { overflow-y: auto; flex-grow: 1; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #f1f1f1; padding-bottom: 6px; font-size: 13px; }
        .cart-total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-top: 10px; padding-top: 8px; border-top: 2px solid #ddd; }
        .cart-qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { background: #eee; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold;}

        /* --- WHATSAPP FLOAT --- */
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background-color: #25d366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="welcome-text">Online Shop</div>
            <button class="header-cart-btn" onclick="toggleCartModal()">
                <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="headerCartTotal">$0.00</span>
            </button>
        </div>
    </header>

    <!-- Cuadrícula de Productos -->
    <div class="product-grid" id="product-container">
        <!-- Producto 1 (Ejemplo) -->
        <div class="product-card" id="card-ACEITE-CAPULLO-750ML">
            <div class="promo-badge-ribbon">Seleccione 6X$11.70</div>
            <div class="product-img-container"><img src="https://alicorp.com.pe/media/Logos/logo_capullo_200x200.png" alt="Capullo 750ml"></div>
            <h3>ACEITE CAPULLO 750ML</h3>
            <p class="price">$1.95</p>
            
            <!-- Botón Agregar (Solo visible cuando cantidad es 0) -->
            <button class="add-btn-first" id="add-btn-ACEITE-CAPULLO-750ML" onclick="agregarAlCarritoInicial('ACEITE CAPULLO 750ML', 1.95)">Agregar</button>
            
            <!-- Controles de Cantidad (Ocultos por defecto, aparecen al agregar) -->
            <div class="product-qty-box" id="qty-box-ACEITE-CAPULLO-750ML">
                <button class="product-qty-btn" onclick="cambiarCantidadGeneral('ACEITE CAPULLO 750ML', -1)">-</button>
                <span class="product-qty-num" id="qty-text-ACEITE-CAPULLO-750ML">0</span>
                <button class="product-qty-btn" onclick="cambiarCantidadGeneral('ACEITE CAPULLO 750ML', 1)">+</button>
            </div>
        </div>

        <!-- Producto 2 (Ejemplo) -->
        <div class="product-card" id="card-ACEITE-CAPULLO-450ML">
            <div class="promo-badge-ribbon">Seleccione 6X$6.78</div>
            <div class="product-img-container"><img src="https://alicorp.com.pe/media/Logos/logo_capullo_200x200.png" alt="Capullo 450ml"></div>
            <h3>ACEITE CAPULLO 450ML</h3>
            <p class="price">$1.13</p>
            
            <button class="add-btn-first" id="add-btn-ACEITE-CAPULLO-450ML" onclick="agregarAlCarritoInicial('ACEITE CAPULLO 450ML', 1.13)">Agregar</button>
            
            <div class="product-qty-box" id="qty-box-ACEITE-CAPULLO-450ML">
                <button class="product-qty-btn" onclick="cambiarCantidadGeneral('ACEITE CAPULLO-450ML', -1)">-</button>
                <span class="product-qty-num" id="qty-text-ACEITE-CAPULLO-450ML">0</span>
                <button class="product-qty-btn" onclick="cambiarCantidadGeneral('ACEITE CAPULLO-450ML', 1)">+</button>
            </div>
        </div>
    </div>

    <!-- Carrito Modal -->
    <div id="cartModal">
        <div class="cart-header-title">
            <span>🛍️ Tu Carrito</span>
            <span onclick="toggleCartModal()" style="cursor: pointer;">✕</span>
        </div>
        <div id="cartItemsList">
            <p style="text-align: center; color: #888;">Tu carrito está vacío</p>
        </div>
        <div id="cartTotalSection"></div>
        <button onclick="enviarPedidoWhatsApp()" style="width: 100%; background: #25d366; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer;">Pedir por WhatsApp</button>
    </div>

    <a href="https://wa.me/50374184366" target="_blank" class="whatsapp-float">💬</a>

    <script>
        // Objeto global para guardar las cantidades de cada producto
        let cantidadesGlobales = {};
        let preciosGlobales = {}; // Para guardar el precio base al agregar

        // Función auxiliar para limpiar nombres para IDs (reemplazar espacios por guiones)
        function limpiarId(nombre) {
            return nombre.replace(/\s+/g, '-');
        }

        // --- LÓGICA PRINCIPAL ---

        // 1. Botón "Agregar" (primera vez)
        function agregarAlCarritoInicial(nombre, precio) {
            preciosGlobales[nombre] = precio; // Guardamos el precio unitario
            cambiarCantidadGeneral(nombre, 1); // Lo inicializamos en 1
        }

        // 2. Botones + y - (tanto en tarjeta como en carrito)
        function cambiarCantidadGeneral(nombre, cambio) {
            const idLimpio = limpiarId(nombre);
            
            // Inicializar si no existe
            if (!cantidadesGlobales[nombre]) {
                cantidadesGlobales[nombre] = 0;
            }

            // Calcular nueva cantidad
            const nuevaCantidad = cantidadesGlobales[nombre] + cambio;
            
            // No permitir bajar de 0
            if (nuevaCantidad < 0) return; 

            cantidadesGlobales[nombre] = nuevaCantidad;

            // Sincronizar UI (Tarjeta y Carrito)
            actualizarUIProducto(nombre);
            actualizarCarritoModal();
        }

        // Actualiza la visualización de un producto específico en la página principal
        function actualizarUIProducto(nombre) {
            const idLimpio = limpiarId(nombre);
            const btnAgregar = document.getElementById(`add-btn-${idLimpio}`);
            const boxCantidad = document.getElementById(`qty-box-${idLimpio}`);
            const textoCantidad = document.getElementById(`qty-text-${idLimpio}`);
            const cantidad = cantidadesGlobales[nombre] || 0;

            if (cantidad > 0) {
                // Ocultar botón "Agregar", mostrar controles
                if (btnAgregar) btnAgregar.classList.add('oculto');
                if (boxCantidad) boxCantidad.classList.add('activo');
                if (textoCantidad) textoCantidad.innerText = cantidad;
            } else {
                // Mostrar botón "Agregar", ocultar controles
                if (btnAgregar) btnAgregar.classList.remove('oculto');
                if (boxCantidad) boxCantidad.classList.remove('activo');
            }
        }

        // Actualiza el modal del carrito completo
        function actualizarCarritoModal() {
            const list = document.getElementById('cartItemsList');
            const totalSection = document.getElementById('cartTotalSection');
            const headerTotal = document.getElementById('headerCartTotal');
            
            let carritoArray = [];
            let totalPrecio = 0;

            // Convertir el objeto de cantidades globales a un array para el carrito
            for (const [nombre, cantidad] of Object.entries(cantidadesGlobales)) {
                if (cantidad > 0) {
                    const precio = preciosGlobales[nombre];
                    carritoArray.push({ nombre, cantidad, precio });
                    totalPrecio += (precio * cantidad);
                }
            }

            // Actualizar contador del header
            headerTotal.innerText = `$${totalPrecio.toFixed(2)}`;

            if (carritoArray.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: #888; font-size: 13px;">Tu carrito está vacío</p>`;
                totalSection.innerHTML = '';
                return;
            }

            // Renderizar filas del carrito
            list.innerHTML = carritoArray.map(item => {
                const subtotal = (item.precio * item.cantidad).toFixed(2);
                return `<div class="cart-item
