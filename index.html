<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda y Mini Súper Online Shop</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #333;
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .header-cart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Search Bar */
        .search-bar-wrapper {
            padding: 10px 15px;
            background-color: var(--primary-color);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .search-bar-wrapper.hidden {
            transform: translateY(-100%);
            opacity: 0;
            height: 0;
            padding: 0 15px;
            overflow: hidden;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 10px 35px 10px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .clear-search {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #888;
            display: none;
            font-weight: bold;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1001;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .suggestion-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-right: 10px;
            border-radius: 4px;
        }

        .suggestion-info {
            flex-grow: 1;
        }

        .suggestion-name {
            font-size: 13px;
            font-weight: bold;
        }

        .suggestion-price {
            font-size: 12px;
            color: var(--accent-color);
        }

        .suggestion-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sug-qty-controls {
            display: flex;
            align-items: center;
            background: #f0f0f0;
            border-radius: 4px;
        }

        .sug-qty-btn {
            border: none;
            background: none;
            padding: 2px 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .sug-qty-num {
            font-size: 12px;
            padding: 0 4px;
        }

        .sug-add-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }

        /* Banner Slider */
        .slider-wrapper {
            overflow: hidden;
            width: 100%;
            max-height: 180px;
            background: #ddd;
        }

        .slider-container {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            box-sizing: border-box;
        }

        .slide img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        /* Layout & Sections */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            padding: 15px 15px 5px 15px;
            color: #444;
        }

        /* Categorías Destacadas Generadas Dinámicamente */
        .featured-categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 15px;
            scrollbar-width: none;
        }

        .featured-categories::-webkit-scrollbar {
            display: none;
        }

        .cat-card {
            min-width: 90px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid #eaeaea;
        }

        .cat-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .cat-card span {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #555;
            word-wrap: break-word;
        }

        /* Grid Productos */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            padding: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .promo-badge-ribbon {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #16a085;
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 2;
        }

        .product-img-container {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .product-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 13px;
            margin: 0 0 4px 0;
            height: 32px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-card .price {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0 0 8px 0;
        }

        .product-bottom-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .product-qty-box {
            display: flex;
            align-items: center;
            background: #eef2f5;
            border-radius: 6px;
            padding: 2px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-qty-btn {
            border: none;
            background: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
        }

        .product-qty-num {
            font-size: 12px;
            font-weight: bold;
        }

        .product-cart-action-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .product-cart-action-btn svg {
            width: 16px;
            height: 16px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }

        /* Paginación */
        .pagination-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            gap: 8px;
        }

        .pagination-info {
            font-size: 12px;
            color: #666;
        }

        .pagination-controls {
            display: flex;
            gap: 5px;
        }

        .page-btn {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .page-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 15px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal Menú Categorías */
        .menu-modal-content {
            background: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 2001;
            padding: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            overflow-y: auto;
        }

        .menu-cat-btn {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: left;
            border: none;
            background: none;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 14px;
        }

        /* Carrito Flotante Modal */
        .cart-modal-content {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 16px 16px 0 0;
            padding: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-qty-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .qty-btn {
            background: #eee;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
            margin: 15px 0;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Principal -->
    <header>
        <div class="header-top">
            <div class="menu-icon" onclick="toggleMenu(event)">☰</div>
            <div class="logo">Tienda y Mini Súper</div>
            <button class="header-cart-btn" onclick="toggleCartModal()">
                🛒 <span id="headerCartTotal">$0.00</span>
            </button>
        </div>
    </header>

    <!-- Barra de Búsqueda Flotante Ocultable -->
    <div class="search-bar-wrapper" id="searchBarWrapper">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Buscar productos..." oninput="manejarBusqueda()">
            <span class="clear-search" id="clearSearchBtn" onclick="limpiarBusqueda()">✕</span>
            <div class="search-suggestions" id="searchSuggestions">
                <div id="suggestionsList"></div>
            </div>
        </div>
    </div>

    <!-- Banner Carrusel -->
    <div class="slider-wrapper">
        <div class="slider-container" id="sliderContainer">
            <div class="slide"><img src="https://via.placeholder.com/600x180/2c3e50/ffffff?text=Ofertas+Especiales" alt="Banner 1"></div>
            <div class="slide"><img src="https://via.placeholder.com/600x180/e74c3c/ffffff?text=Envíos+a+Domicilio" alt="Banner 2"></div>
        </div>
    </div>

    <!-- Categorías Destacadas (Cargadas dinámicamente desde Col I, J, K) -->
    <div class="section-title">Categorías destacadas</div>
    <div class="featured-categories" id="contenedor-categorias"></div>

    <!-- Grid de Productos -->
    <div class="section-title">Productos</div>
    <div class="product-grid" id="product-container"></div>

    <!-- Paginación -->
    <div id="pagination-section"></div>

    <!-- Modal de Menú Lateral -->
    <div class="modal" id="menuModal" onclick="toggleMenu(event)">
        <div class="menu-modal-content" onclick="event.stopPropagation()">
            <h3>Categorías</h3>
            <div id="menuCategoriesList"></div>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <button class="menu-cat-btn" onclick="toggleAdminPanel()">⚙️ Configuración Sheet</button>
            <div id="adminPanel" style="display: none; padding-top: 10px;">
                <input type="text" id="sheetUrl" placeholder="URL de Google Sheets" style="width: 100%; padding: 6px; margin-bottom: 6px; box-sizing: border-box;">
                <button onclick="loadInventory(true)" style="width: 100%; padding: 6px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">Guardar y Cargar</button>
            </div>
        </div>
    </div>

    <!-- Modal Detalle del Producto -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModalProducto()">✕</span>
            <div id="modalImgContainer" style="width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 10px;">
                <img id="modalImg" src="" style="max-height: 100%; max-width: 100%; object-fit: contain;">
            </div>
            <h2 id="modalNombre" style="font-size: 16px; margin: 0 0 5px 0;"></h2>
            <div id="modalPrecio" style="font-size: 18px; font-weight: bold; color: var(--accent-color); margin-bottom: 12px;"></div>
            
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <div style="display: flex; align-items: center; background: #eee; border-radius: 6px; padding: 4px 8px;">
                    <button style="border:none; background:none; font-weight:bold; cursor:pointer;" onclick="cambiarPrincipalModalCantidad(-1)">-</button>
                    <span id="modalPrincipalQty" style="margin: 0 8px; font-weight:bold;">1</span>
                    <button style="border:none; background:none; font-weight:bold; cursor:pointer;" onclick="cambiarPrincipalModalCantidad(1)">+</button>
                </div>
                <button style="flex-grow: 1; background: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;" onclick="agregarProductoPrincipalDesdeModal()">Agregar al Carrito</button>
            </div>

            <h4 style="margin: 15px 0 8px 0; font-size: 13px; color: #666;">Productos relacionados:</h4>
            <div id="modalRelacionados" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
        </div>
    </div>

    <!-- Modal Carrito de Compras -->
    <div class="modal" id="cartModal">
        <div class="cart-modal-content" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0;">Tu Carrito</h3>
                <span style="cursor: pointer; font-weight: bold;" onclick="toggleCartModal()">✕</span>
            </div>
            <div id="cartItemsList"></div>
            <div id="cartTotalSection"></div>
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">Completar Pedido por WhatsApp</button>
        </div>
    </div>
    <!-- Código JavaScript Integrado -->
    <script>
        let lastScrollTop = 0;
        const searchBarWrapper = document.getElementById('searchBarWrapper');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                searchBarWrapper.classList.add('hidden');
            } else {
                searchBarWrapper.classList.remove('hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, false);

        let currentIndex = 0;
        function changeSlide() {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;
            currentIndex = (currentIndex + 1) % slides.length;
            const container = document.getElementById('sliderContainer');
            container.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
        setInterval(changeSlide, 4000);

        let allProducts = [], carrito = [], categoriaSeleccionada = 'TODOS';
        let sugCantidades = {}, cardCantidades = {}, modalCantidades = {}, principalModalCantidad = 1;
        let productoModalActual = null;
        let paginaActual = 1;
        const productosPorPagina = 12;

        window.onload = () => { loadInventory(false); };

        document.addEventListener('click', function(event) {
            const modal = document.getElementById('cartModal');
            const cartBtn = document.querySelector('.header-cart-btn');
            const searchContainer = document.querySelector('.search-container');
            const productModal = document.getElementById('productModal');

            if (modal.style.display === 'flex' && !modal.contains(event.target) && !cartBtn.contains(event.target)) modal.style.display = 'none';
            if (productModal.style.display === 'flex' && event.target === productModal) productModal.style.display = 'none';
            if (!searchContainer.contains(event.target)) {
                document.getElementById('searchSuggestions').style.display = 'none';
                document.body.classList.remove('search-active');
            }
        });

        function toggleMenu(e) {
            const modal = document.getElementById('menuModal');
            if (!e || e.target === modal || e.currentTarget.classList.contains('menu-icon')) modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleAdminPanel() {
            toggleMenu();
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        async function loadInventory(save) {
            let url = localStorage.getItem('savedSheetUrl') || "https://docs.google.com/spreadsheets/d/1bXSibj51JO5ilbs_HRkUy96-gTXQmC2NxGsyPXNyDU8/edit?usp=sharing";
            if (save) { url = document.getElementById('sheetUrl').value; localStorage.setItem('savedSheetUrl', url); }
            url = url.split('/edit')[0] + '/export?format=csv';
            try {
                const res = await fetch(url);
                const data = await res.text();
                const lines = data.split('\n');
                allProducts = lines.slice(1).map(line => {
                    const cols = line.split(',').map(val => val ? val.replace(/^"|"$/g, '').trim() : '');
                    
                    const limpiarNum = (val) => {
                        if (!val) return 0;
                        return parseFloat(val.replace('$', '').replace(',', '.')) || 0;
                    };

                    return { 
                        nombre: cols[0] || '', 
                        existencia: cols[1] || '', 
                        precio: limpiarNum(cols[2]), 
                        categoria: (cols[3] || 'GENERAL').toUpperCase(), 
                        imagen: cols[4] || '', 
                        mostrar: cols[5] ? cols[5].toUpperCase() : 'SI',
                        minDesc: parseInt(cols[6]) || 0, 
                        precioDesc: limpiarNum(cols[7]),
                        // Lectura de Columnas I, J y K desde Google Sheets
                        catDestacada: cols[8] || '',
                        mostrarCat: cols[9] ? cols[9].toUpperCase() : '',
                        imagenCat: cols[10] || ''
                    };
                }).filter(p => p.nombre !== '' && p.mostrar !== 'NO');
                
                allProducts.forEach(p => { 
                    sugCantidades[p.nombre] = 1; 
                    cardCantidades[p.nombre] = 1;
                    modalCantidades[p.nombre] = 1;
                });

                generarCategoriasDestacadas();
                generarMenuCategorias();
                filtrarProductos();
            } catch(e) { console.error(e); }
        }

        // Genera dinámicamente el carrusel de categorías con Col I, J y K
        function generarCategoriasDestacadas() {
            const container = document.getElementById('contenedor-categorias');
            if (!container) return;

            const destacadasMap = new Map();

            allProducts.forEach(p => {
                if (p.catDestacada && p.imagenCat && p.mostrarCat !== 'NO') {
                    const catNombre = p.catDestacada.trim().toUpperCase();
                    if (!destacadasMap.has(catNombre)) {
                        destacadasMap.set(catNombre, p.imagenCat.trim());
                    }
                }
            });

            if (destacadasMap.size === 0) {
                container.innerHTML = `<p style="font-size:12px; color:#888; padding: 0 15px;">No hay categorías destacadas configuradas.</p>`;
                return;
            }

            let html = '';
            destacadasMap.forEach((imgUrl, catNombre) => {
                html += `
                    <div class="cat-card" onclick="seleccionarCategoria('${catNombre}')">
                        <img src="${imgUrl}" alt="${catNombre}" onerror="this.src='https://via.placeholder.com/150?text=Sin+Foto'" loading="lazy">
                        <span>${catNombre}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function generarMenuCategorias() {
            const container = document.getElementById('menuCategoriesList');
            const cats = [...new Set(allProducts.map(p => p.categoria))];
            container.innerHTML = `<button class="menu-cat-btn" onclick="seleccionarCategoria('TODOS')">📋 TODOS</button>` + cats.map(c => `<button class="menu-cat-btn" onclick="seleccionarCategoria('${c}')">📁 ${c}</button>`).join('');
        }

        function seleccionarCategoria(cat) { 
            categoriaSeleccionada = cat; paginaActual = 1; filtrarProductos(); document.getElementById('searchSuggestions').style.display = 'none'; document.body.classList.remove('search-active'); document.getElementById('searchInput').value = ''; document.getElementById('clearSearchBtn').style.display = 'none'; document.getElementById('menuModal').style.display = 'none';
        }

        function manejarBusqueda() {
            const textoInput = document.getElementById('searchInput').value;
            document.getElementById('clearSearchBtn').style.display = textoInput.length > 0 ? 'block' : 'none';
            paginaActual = 1; filtrarProductos(); mostrarSugerenciasFlotantes(textoInput);
        }

        function limpiarBusqueda() {
            document.getElementById('searchInput').value = ''; 
            document.getElementById('clearSearchBtn').style.display = 'none'; 
            document.getElementById('searchSuggestions').style.display = 'none'; 
            document.body.classList.remove('search-active'); 
            paginaActual = 1; 
            filtrarProductos();
        }

        function mostrarSugerenciasFlotantes(texto) {
            const suggestionsBox = document.getElementById('searchSuggestions'), suggestionsList = document.getElementById('suggestionsList');
            if (!texto || texto.trim() === '') { 
                suggestionsBox.style.display = 'none'; 
                document.body.classList.remove('search-active'); 
                return; 
            }
            
            const filtrados = allProducts.filter(p => p.nombre.toLowerCase().includes(texto.toLowerCase())).slice(0, 5);
            
            if (filtrados.length === 0) { 
                suggestionsBox.style.display = 'none'; 
                document.body.classList.remove('search-active'); 
                return; 
            }

            document.body.classList.add('search-active');

            suggestionsList.innerHTML = filtrados.map(p => {
                let qty = sugCantidades[p.nombre] || 1;
                let promoRibbonText = '';
                if (p.minDesc > 0 && p.precioDesc > 0) {
                    let totalPromo = (p.minDesc * p.precioDesc).toFixed(2);
                    promoRibbonText = `<div style="font-size: 10px; color: #16a085;">📦 Seleccione ${p.minDesc}X$${totalPromo}</div>`;
                }
                return `<div class="suggestion-item" onclick="abrirModalPorNombreYLimpiarBusqueda('${p.nombre}')">
                    <img class="suggestion-img" src="${p.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" alt="${p.nombre}" loading="lazy">
                    <div class="suggestion-info">
                        <div class="suggestion-name">${p.nombre}</div>
                        <div class="suggestion-price">$${p.precio.toFixed(2)}</div>
                        ${promoRibbonText}
                    </div>
                    <div class="suggestion-actions" onclick="event.stopPropagation()">
                        <div class="sug-qty-controls">
                            <button class="sug-qty-btn" onclick="cambiarSugCantidad('${p.nombre}', -1, event)">-</button>
                            <span class="sug-qty-num" id="sug-qty-${p.nombre}">${qty}</span>
                            <button class="sug-qty-btn" onclick="cambiarSugCantidad('${p.nombre}', 1, event)">+</button>
                        </div>
                        <button class="sug-add-btn" onclick="agregarDesdeSugerencia('${p.nombre}', ${p.precio}, event)">🛒</button>
                    </div>
                </div>`;
            }).join('');
            suggestionsBox.style.display = 'block';
        }

        function abrirModalPorNombreYLimpiarBusqueda(nombre) {
            document.getElementById('searchSuggestions').style.display = 'none';
            document.body.classList.remove('search-active');
            abrirModalPorNombre(nombre);
        }

        function cambiarSugCantidad(nombre, cambio, event) {
            event.stopPropagation();
            if (!sugCantidades[nombre]) sugCantidades[nombre] = 1;
            sugCantidades[nombre] = Math.max(1, sugCantidades[nombre] + cambio);
            document.getElementById(`sug-qty-${nombre}`).innerText = sugCantidades[nombre];
        }

        function agregarDesdeSugerencia(nombre, precio, event) {
            event.stopPropagation();
            const cantidad = sugCantidades[nombre] || 1;
            const item = carrito.find(i => i.nombre === nombre);
            if (item) item.cantidad += cantidad; else carrito.push({ nombre, precio, cantidad });
            
            sugCantidades[nombre] = 1;
            actualizarCarritoBarra();
        }

        function filtrarProductos() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = allProducts.filter(p => {
                const coincideCat = (categoriaSeleccionada === 'TODOS' || p.categoria === categoriaSeleccionada || p.catDestacada.toUpperCase() === categoriaSeleccionada);
                const coincideTexto = p.nombre.toLowerCase().includes(texto);
                return coincideCat && coincideTexto;
            });

            const totalPaginas = Math.ceil(filtrados.length / productosPorPagina) || 1;
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            const productosPagina = filtrados.slice((paginaActual - 1) * productosPorPagina, paginaActual * productosPorPagina);
            
            document.getElementById('product-container').innerHTML = productosPagina.map(p => {
                let promoRibbonHtml = '';
                if (p.minDesc > 0 && p.precioDesc > 0) {
                    let totalPromo = (p.minDesc * p.precioDesc).toFixed(2);
                    promoRibbonHtml = `<div class="promo-badge-ribbon">Seleccione ${p.minDesc}X$${totalPromo}</div>`;
                }

                let currentCardQty = cardCantidades[p.nombre] || 1;

                return `<div class="product-card">
                    ${promoRibbonHtml}
                    <div class="product-img-container" onclick="abrirModalPorNombre('${p.nombre}')">
                        <img src="${p.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" alt="${p.nombre}" loading="lazy">
                    </div>
                    <h3>${p.nombre}</h3>
                    <p class="price">$${p.precio.toFixed(2)}</p>
                    <div class="product-bottom-action">
                        <div class="product-qty-box">
                            <button class="product-qty-btn" onclick="cambiarCardCantidad('${p.nombre}', -1)">-</button>
                            <span class="product-qty-num" id="card-qty-${p.nombre}">${currentCardQty}</span>
                            <button class="product-qty-btn" onclick="cambiarCardCantidad('${p.nombre}', 1)">+</button>
                        </div>
                        <button class="product-cart-action-btn" onclick="agregarAlCarritoDesdeTarjeta('${p.nombre}', ${p.precio})">
                            <svg viewBox="0 0 24 24">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                        </button>
                    </div>
                </div>`;
            }).join('');
            renderizarPaginacion(totalPaginas);
        }

        function abrirModalPorNombre(nombre) {
            const p = allProducts.find(item => item.nombre === nombre);
            if (p) {
                abrirModalProducto(p);
            }
        }

        function abrirModalProducto(p) {
            productoModalActual = { nombre: p.nombre, precio: p.precio };
            principalModalCantidad = 1;
            document.getElementById('modalPrincipalQty').innerText = '1';

            document.getElementById('modalNombre').innerText = p.nombre;
            document.getElementById('modalPrecio').innerText = `$${p.precio.toFixed(2)}`;
            document.getElementById('modalImg').src = p.imagen || 'https://via.placeholder.com/150?text=Sin+Foto';

            const imgContainer = document.getElementById('modalImgContainer');
            const etiquetaExistente = imgContainer.querySelector('.promo-badge-ribbon');
            if (etiquetaExistente) etiquetaExistente.remove();

            if (p.minDesc > 0 && p.precioDesc > 0) {
                let totalPromo = (p.minDesc * p.precioDesc).toFixed(2);
                const ribbon = document.createElement('div');
                ribbon.className = 'promo-badge-ribbon';
                ribbon.innerText = `Seleccione ${p.minDesc}X$${totalPromo}`;
                imgContainer.appendChild(ribbon);
            }

            const relacionados = allProducts.filter(item => item.categoria === p.categoria && item.nombre !== p.nombre).slice(0, 4);
            const containerRel = document.getElementById('modalRelacionados');

            if (relacionados.length === 0) {
                containerRel.innerHTML = `<p style="font-size: 12px; color: #888; text-align: center; grid-column: span 2;">No hay más productos en esta categoría.</p>`;
            } else {
                containerRel.innerHTML = relacionados.map(r => {
                    let qtyModal = modalCantidades[r.nombre] || 1;
                    return `
                        <div style="background: white; padding: 10px; border-radius: 10px; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between;">
                            <div onclick="abrirModalPorNombre('${r.nombre}')" style="cursor: pointer;">
                                <div style="width: 100%; height: 90px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; border-radius: 6px; margin-bottom: 6px;">
                                    <img src="${r.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                                </div>
                                <div style="font-size: 12px; font-weight: bold; color: #333; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${r.nombre}</div>
                                <div style="font-size: 13px; color: var(--accent-color); font-weight: bold; margin: 4px 0;">$${r.precio.toFixed(2)}</div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px; margin-top: 6px;">
                                <div style="display: flex; align-items: center; justify-content: space-between; background: #eef2f5; border-radius: 6px; padding: 2px; border: 1px solid #dcdcdc; flex-grow: 1; height: 32px;">
                                    <button style="background:none; border:none; font-size:14px; font-weight:bold; color:#555; cursor:pointer; padding:0 6px;" onclick="cambiarModalCantidad('${r.nombre}', -1)">-</button>
                                    <span style="font-size: 12px; font-weight: bold; color: #333;" id="modal-qty-${r.nombre}">${qtyModal}</span>
                                    <button style="background:none; border:none; font-size:14px; font-weight:bold; color:#555; cursor:pointer; padding:0 6px;" onclick="cambiarModalCantidad('${r.nombre}', 1)">+</button>
                                </div>
                                <button style="background-color: var(--accent-color); border: none; border-radius: 6px; width: 34px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;" onclick="agregarDesdeModalRelacionado('${r.nombre}', ${r.precio})">
                                    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;">
                                        <circle cx="9" cy="21" r="1"></circle>
                                        <circle cx="20" cy="21" r="1"></circle>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('productModal').style.display = 'flex';
        }

        function cambiarPrincipalModalCantidad(cambio) {
            principalModalCantidad = Math.max(1, principalModalCantidad + cambio);
            document.getElementById('modalPrincipalQty').innerText = principalModalCantidad;
        }

        function agregarProductoPrincipalDesdeModal() {
            if (!productoModalActual) return;
            const item = carrito.find(i => i.nombre === productoModalActual.nombre);
            if (item) {
                item.cantidad += principalModalCantidad;
            } else {
                carrito.push({ nombre: productoModalActual.nombre, precio: productoModalActual.precio, cantidad: principalModalCantidad });
            }
            principalModalCantidad = 1;
            document.getElementById('modalPrincipalQty').innerText = '1';
            actualizarCarritoBarra();
        }

        function cambiarModalCantidad(nombre, cambio) {
            if (!modalCantidades[nombre]) modalCantidades[nombre] = 1;
            modalCantidades[nombre] = Math.max(1, modalCantidades[nombre] + cambio);
            const el = document.getElementById(`modal-qty-${nombre}`);
            if (el) el.innerText = modalCantidades[nombre];
        }

        function agregarDesdeModalRelacionado(nombre, precio) {
            const cantidadSeleccionada = modalCantidades[nombre] || 1;
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cantidadSeleccionada;
            } else {
                carrito.push({ nombre, precio, cantidad: cantidadSeleccionada });
            }
            modalCantidades[nombre] = 1;
            const el = document.getElementById(`modal-qty-${nombre}`);
            if (el) el.innerText = 1;
            
            actualizarCarritoBarra();
        }

        function cerrarModalProducto() {
            document.getElementById('productModal').style.display = 'none';
        }

        function renderizarPaginacion(totalPaginas) {
            const container = document.getElementById('pagination-section');
            if (totalPaginas <= 1) { container.innerHTML = ''; return; }
            let inicio = Math.max(1, paginaActual - 2), fin = Math.min(totalPaginas, inicio + 4);
            if (fin - inicio < 4) inicio = Math.max(1, fin - 4);
            let botones = '';
            for (let i = inicio; i <= fin; i++) botones += `<button class="page-btn ${i === paginaActual ? 'active' : ''}" onclick="cambiarPagina(${i})">${i}</button>`;
            container.innerHTML = `<div class="pagination-container"><div class="pagination-info">Página ${paginaActual} de ${totalPaginas}</div><div class="pagination-controls"><button class="page-btn" onclick="cambiarPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>Anterior</button>${botones}<button class="page-btn" onclick="cambiarPagina(${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled' : ''}>Siguiente</button></div></div>`;
        }

        function cambiarPagina(n) { paginaActual = n; filtrarProductos(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function cambiarCardCantidad(nombre, cambio) {
            if (!cardCantidades[nombre]) cardCantidades[nombre] = 1;
            cardCantidades[nombre] = Math.max(1, cardCantidades[nombre] + cambio);
            const el = document.getElementById(`card-qty-${nombre}`);
            if (el) el.innerText = cardCantidades[nombre];
        }

        function agregarAlCarritoDesdeTarjeta(nombre, precio) {
            const cantidadSeleccionada = cardCantidades[nombre] || 1;
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad += cantidadSeleccionada;
            } else {
                carrito.push({ nombre, precio, cantidad: cantidadSeleccionada });
            }
            cardCantidades[nombre] = 1;
            const el = document.getElementById(`card-qty-${nombre}`);
            if (el) el.innerText = 1;
            
            actualizarCarritoBarra();
        }

        function cambiarCantidadCarrito(e, nombre, cambio) {
            e.stopPropagation();
            const item = carrito.find(i => i.nombre === nombre);
            if (item) { 
                item.cantidad += cambio; 
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.nombre !== nombre);
                }
            }
            actualizarCarritoBarra();
        }

        function actualizarCarritoBarra() {
            let totalPrecio = 0;
            
            const carritoConPrecios = carrito.map(item => {
                const productoBase = allProducts.find(p => p.nombre === item.nombre);
                let precioFinal = item.precio;

                if (productoBase && productoBase.minDesc > 0 && productoBase.precioDesc > 0 && item.cantidad >= productoBase.minDesc) {
                    precioFinal = productoBase.precioDesc;
                }
                
                totalPrecio += (precioFinal * item.cantidad);
                return { ...item, precioFinal };
            });

            document.getElementById('headerCartTotal').innerText = `$${totalPrecio.toFixed(2)}`;
            
            const list = document.getElementById('cartItemsList');
            if (carrito.length === 0) { 
                list.innerHTML = `<p style="text-align: center; color: #888; font-size: 13px;">Tu carrito está vacío</p>`; 
                document.getElementById('cartTotalSection').innerHTML = ''; 
                return; 
            }

            list.innerHTML = carritoConPrecios.map(i => {
                const subtotal = (i.precioFinal * i.cantidad).toFixed(2);
                return `<div class="cart-item-row">
                    <div>
                        <strong>${i.nombre}</strong><br>
                        <span style="color: #666; font-size: 11px;">$${subtotal} (${i.cantidad} unids)</span>
                        ${i.precioFinal < i.precio ? '<span style="color: #16a085; font-size: 10px; display:block; font-weight:bold;">✓ ¡Precio de mayor aplicado!</span>' : ''}
                    </div>
                    <div class="cart-qty-controls">
                        <button class="qty-btn" onclick="cambiarCantidadCarrito(event, '${i.nombre}', -1)">-</button>
                        <span style="font-weight: bold; min-width: 22px; text-align: center; font-size: 15px;">${i.cantidad}</span>
                        <button class="qty-btn" onclick="cambiarCantidadCarrito(event, '${i.nombre}', 1)">+</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('cartTotalSection').innerHTML = `<div class="cart-total-row"><span>Total:</span><span style="color: var(--accent-color);">$${totalPrecio.toFixed(2)}</span></div>`;
        }

        function toggleCartModal() { const modal = document.getElementById('cartModal'); modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex'; }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return alert("Tu carrito está vacío");
            
            let msg = "Hola, quiero hacer el siguiente pedido:\n";
            let totalPrecio = 0;

            carrito.forEach(i => {
                const productoBase = allProducts.find(p => p.nombre === i.nombre);
                let precioFinal = i.precio;
                let esMayor = false;
                if (productoBase && productoBase.minDesc > 0 && productoBase.precioDesc > 0 && i.cantidad >= productoBase.minDesc) {
                    precioFinal = productoBase.precioDesc;
                    esMayor = true;
                }
                totalPrecio += (precioFinal * i.cantidad);
                msg += `• ${i.cantidad}x ${i.nombre} - $${(precioFinal * i.cantidad).toFixed(2)}${esMayor ? ' (Precio de mayor)' : ''}\n`;
            });

            msg += `\n*Total: $${totalPrecio.toFixed(2)}*`;
            window.open(`https://wa.me/50374184366?text=${encodeURIComponent(msg)}`);
            carrito = []; actualizarCarritoBarra(); filtrarProductos(); toggleCartModal();
        }
    </script>
</body>
</html>
