<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop - Versión Avanzada</title>
    <style>
        :root { --accent-color: #f39c12; --bg-color: #f4f4f9; }
        body { font-family: sans-serif; margin: 0; padding-bottom: 80px; background: var(--bg-color); }
        
        /* Layout Principal */
        .main-container { display: flex; flex-direction: row; }
        .product-section { flex: 1; padding: 15px; }
        
        /* Carrito Lateral (Fijo) */
        .cart-sidebar { width: 300px; padding: 15px; border-left: 1px solid #ddd; height: 100vh; overflow-y: auto; position: sticky; top: 0; background: white; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .product-card { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        
        /* Botones de cantidad en carrito */
        .qty-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; }
        .btn-qty { padding: 2px 8px; cursor: pointer; background: #eee; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="product-section">
        <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filtrarProductos()">
        <div class="product-grid" id="product-container"></div>
    </div>
    
    <div class="cart-sidebar">
        <h3>Tu Carrito</h3>
        <div id="cartItemsList"></div>
        <div id="cartTotal"></div>
    </div>
</div>

<script>
    let allProducts = [], carrito = [];

    // Función de carga con filtro de 'Mostrar'
    async function loadInventory() {
        let url = "https://docs.google.com/spreadsheets/d/1bXSibj51JO5ilbs_HRkUy96-gTXQmC2NxGsyPXNyDU8/export?format=csv";
        try {
            const res = await fetch(url);
            const data = await res.text();
            const lines = data.split('\n');
            
            allProducts = lines.slice(1).map(line => {
                const cols = line.split(',');
                // Columna 5 (índice 5) es la que define "Mostrar"
                let valMostrar = cols[5] ? cols[5].trim().toUpperCase() : 'SI';
                return { 
                    nombre: cols[0], precio: parseFloat(cols[2]), 
                    imagen: cols[4], mostrar: valMostrar 
                };
            }).filter(p => p.nombre && p.mostrar !== 'NO' && p.mostrar !== 'N'); // FILTRO CORREGIDO
            
            renderProductos();
        } catch(e) { console.error(e); }
    }

    function renderProductos() {
        const container = document.getElementById('product-container');
        container.innerHTML = allProducts.map(p => `
            <div class="product-card">
                <img src="${p.imagen}" class="product-img">
                <p>${p.nombre}</p>
                <p><b>$${p.precio.toFixed(2)}</b></p>
                <button onclick="agregar('${p.nombre}', ${p.precio})">Agregar</button>
            </div>
        `).join('');
    }

    function agregar(nombre, precio) {
        let item = carrito.find(i => i.nombre === nombre);
        if(item) item.cantidad++; else carrito.push({nombre, precio, cantidad: 1});
        actualizarCarrito();
    }

    function actualizarCarrito() {
        const list = document.getElementById('cartItemsList');
        list.innerHTML = carrito.map(i => `
            <div>
                ${i.nombre} - $${i.precio}
                <div class="qty-controls">
                    <button class="btn-qty" onclick="cambiarCantidad('${i.nombre}', -1)">-</button>
                    <span>${i.cantidad}</span>
                    <button class="btn-qty" onclick="cambiarCantidad('${i.nombre}', 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function cambiarCantidad(nombre, delta) {
        let item = carrito.find(i => i.nombre === nombre);
        item.cantidad += delta;
        if(item.cantidad <= 0) carrito = carrito.filter(i => i.nombre !== nombre);
        actualizarCarrito();
    }

    window.onload = loadInventory;
</script>
</body>
</html>
